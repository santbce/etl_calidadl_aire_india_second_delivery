name: india-final
x-project: &project
  image: india-final-app:local
  build:
    context: .
    dockerfile: Dockerfile.airflow
  user: "50000:0"
  volumes:
    - .:/opt/project
  environment: &environment
    INDIA_PROJECT_ROOT: /opt/project
    INDIA_DATABASE_URL: postgresql://india:india_demo_local@postgres:5432/india
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_TOPIC: india.aqi.features.v1
    PYTHONPATH: /opt/project/src
    AIRFLOW_HOME: /opt/project/runtime/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/project/runtime/airflow/airflow.db
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
services:
  postgres:
    image: postgres:16.11
    environment:
      POSTGRES_USER: india
      POSTGRES_PASSWORD: india_demo_local
      POSTGRES_DB: india
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - india-postgres:/var/lib/postgresql/data
      - .:/opt/project:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U india -d india"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka:
    image: apache/kafka:4.1.2
    ports: ["127.0.0.1:19092:19092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20
  tools:
    <<: *project
    entrypoint: []
    command: ["python", "--version"]
    profiles: ["tools"]
  airflow:
    <<: *project
    ports: ["127.0.0.1:8088:8080"]
    command: ["standalone"]
    depends_on:
      postgres: {condition: service_healthy}
    profiles: ["airflow"]
  consumer:
    <<: *project
    entrypoint: []
    command: ["python", "src/final_stream.py", "consume"]
    depends_on:
      kafka: {condition: service_healthy}
    profiles: ["live"]
  dashboard:
    <<: *project
    entrypoint: []
    command: ["streamlit", "run", "app/dashboard.py", "--server.address=0.0.0.0", "--browser.gatherUsageStats=false"]
    ports: ["127.0.0.1:8502:8501"]
    profiles: ["live"]
volumes:
  india-postgres:
